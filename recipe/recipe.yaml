schema_version: 1

context:
  name: genesis-world
  version: "1.4.6"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/Genesis-Embodied-AI/genesis-world/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 741bcbdc769659e370d7431c857abcbca3dae2b12ea301fd88aad47443d60feb
  patches:
    # Remove once conda-forge's moviepy accepts Pillow 11 and the optional
    # gs-madrona batch renderer is packaged for conda-forge.
    - patches/0001-relax-conda-runtime-metadata.patch
    # Remove once the restricted IsaacGym helper is no longer shipped or is
    # made optional upstream without importing it at module load time.
    - patches/0002-drop-restricted-isaacgym-helper.patch

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - gs = genesis._main:main
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
    - wheel
    - cython >=3.0.0
    - numpy >=1.26.4
  run:
    - python >=${{ python_min }},<3.15
    - av
    - coacd >=1.0.12
    - dracopy
    - fast-simplification >=0.1.12
    - freetype-py
    - frozendict
    - igl !=2.6.2
    - moviepy >=2.0.0
    - mujoco >=3.2.5
    - numba
    - numpy >=1.26.4
    - openexr-python
    - pillow >=10,<12
    - psutil
    - py-cpuinfo
    - py-opencv
    - pycollada
    - pydantic >=2.13.0
    - pygel3d >=0.8.0
    - pyglet >=1.5,!=2.1.8
    - pygltflib
    - pymeshlab
    - pyopengl >=3.1.4
    - pysplashsurf >=0.14,<0.15
    - pytorch >=2.8
    - python-tetgen
    - quadrants ==1.4.0
    - rtree
    - scikit-image
    - trimesh >=5.0.0
    - xacro
    - zstandard

tests:
  - python:
      imports:
        - genesis
        - genesis.vis.batch_renderer
      pip_check: true
      python_version: ${{ python_min }}.*
  - script:
      - xvfb-run -a python -X faulthandler run_test.py
      - gs --help
    files:
      recipe:
        - run_test.py
    requirements:
      run:
        - python ${{ python_min }}.*
        # mesa 26.2.3 builds llvmpipe against LLVM 23, which segfaults once
        # quadrants (LLVM 22) has run a kernel in the same process. Remove when
        # quadrants and mesa-libgallium use the same LLVM major.
        - mesalib 26.2.1.*

about:
  homepage: https://genesis-embodied-ai.github.io/
  summary: Universal and generative physics engine for robotics and embodied AI
  license: Apache-2.0 AND MIT AND OFL-1.1
  license_file:
    - LICENSE
    - LICENSE-vendored-pyrender-urdfpy
    - LICENSE-vendored-fonts
  repository: https://github.com/Genesis-Embodied-AI/genesis-world
  documentation: https://genesis-world.readthedocs.io/

extra:
  feedstock-name: genesis-world
  recipe-maintainers:
    - jeongseok-meta
